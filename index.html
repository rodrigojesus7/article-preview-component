<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Preview Component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/responsive.css">

</head>

<body>

    <main>
        <img class="main-image" src="./src/images/drawers.jpg" alt="image of a drawer">
        <article>
            <h1 class="article__title text-preset-1">Shift the overall look and feel by adding these wonderful touches
                to furniture in your home</h1>
            <p class="article__text text-preset-2-medium">Ever been in a room and felt like something was missing? Perhaps it felt slightly
                bare and uninviting.
                I’ve got some simple tips to help you make any room feel complete.</p>
            <div>
                <div class="user">
                    <img class="user__image" src="./src/images/avatar-michelle.jpg" alt="user image">
                    <div class="user__info">
                        <p class="user__name text-preset-2-bold">Michelle Appleton</p>
                        <p class="User__post-date text-preset-2-medium">28 Jun 2020</p>
                    </div>
                </div>
                <button class="share-button"><img src="./src/images/icon-share.svg" alt="share button icon"></button>
            </div>
        </article>
    </main>




    <script src="./src/js/index.js"></script>
</body>

</html>
